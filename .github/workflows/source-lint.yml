name: Source lint

on:
  pull_request:
    paths:
      - ".github/workflows/source-lint.yml"
      - ".codex/setup.sh"
      - ".devcontainer/**"
      - "bin/lint"
      - "bin/lint-js"
      - "bin/lint-python"
      - "bin/site-code-update"
      - "tooling/lint/**"
      - "docs-viewer/build/**"
      - "docs-viewer/migrations/**"
      - "docs-viewer/runtime/js/**"
      - "docs-viewer/static/css/docs-viewer-reports.css"
      - "docs-viewer/static/css/docs-viewer-theme.css"
      - "docs-viewer/static/css/docs-viewer.css"
      - "docs-viewer/services/**"
      - "docs-viewer/tests/**"
      - "shared/frontend/js/**"
      - "site/assets/js/**"
      - "site/docs-viewer/runtime/js/**"
      - "site-tools/site_tools/**"
      - "site-tools/tests/**"
      - "site-tools/site_validate.py"
      - "studio/app/frontend/js/**"
      - "studio/app/server/**"
      - "studio/checks/**"
      - "studio/commands/**"
      - "studio/services/**"
      - "studio/shared/python/**"
      - "studio/tests/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Maintained Python and JavaScript boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: "npm"
          cache-dependency-path: "tooling/lint/package-lock.json"

      - name: Install repository lint tools
        run: |
          python -m venv tooling/lint/.venv
          tooling/lint/.venv/bin/python -m pip install --requirement tooling/lint/python-requirements.txt
          npm ci --prefix tooling/lint

      - name: Lint maintained source boundaries
        run: |
          bin/lint --scope shared
          bin/lint --scope site-tools
          bin/lint --scope studio
          bin/lint --scope public-site
          bin/lint --scope docs-viewer
          bin/lint --scope tests
