<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analysis | dotlineform</title>
  <meta name="dlf-asset-version" content="docs-viewer-style-20260731a">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#111111">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', (t === 'light' || t === 'dark') ? t : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="/assets/css/main.css?v=static">
  <link rel="stylesheet" href="/docs-viewer/static/css/docs-viewer-theme.css?v=docs-viewer-style-20260731a">
  <link rel="stylesheet" href="/docs-viewer/static/css/docs-viewer.css?v=docs-viewer-style-20260731a">
  <link rel="stylesheet" href="/docs-viewer/static/css/docs-viewer-reports.css?v=docs-viewer-style-20260731a">
</head>
<body class="analysis">
  <main class="container">
    <section
      class="docsViewer"
      id="docsViewerRoot"
      data-route-id="analysis"
      data-docs-viewer-app-kind="public"
      data-route-config-url="/docs-viewer/config/routes/docs-viewer-public-routes.json"
      data-docs-viewer-ready="false"
      data-docs-viewer-busy="false"
    >
      <div class="docsViewer__controls">
        <div
          id="docsViewerHeaderControlsMount"
          data-docs-viewer-header-controls-mount
          data-enable-search="true"
          data-search-placeholder="search analysis"
          data-search-aria-label="Search analysis"
        ></div>
        <p class="docsViewer__status muted small" id="docsViewerStatus" hidden></p>
        <div class="docsViewer__bookmarkRow" id="docsViewerBookmarkRow" hidden></div>
      </div>
      <div id="docsViewerIndexPanelMount" data-docs-viewer-index-panel-mount></div>
      <div id="docsViewerMainViewMount" data-docs-viewer-main-view-mount>
        <noscript>This docs viewer requires JavaScript to load the generated docs index.</noscript>
      </div>
      <div id="docsViewerInfoPanelMount" data-docs-viewer-info-panel-mount></div>
    </section>
    <script type="module" src="/docs-viewer/runtime/js/public/docs-viewer-public.js?v=docs-viewer-style-20260731a"></script>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="muted">&copy; 2026 dotlineform &middot; <a href="/about/">about</a> &middot; <a href="/archive/">archive</a></span>
    </div>
  </footer>

</body>
</html>
