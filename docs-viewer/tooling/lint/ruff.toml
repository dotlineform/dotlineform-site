target-version = "py312"
force-exclude = true
cache-dir = "docs-viewer/tooling/lint/.ruff_cache"
extend-exclude = [
    "admin-app/**",
    "docs-viewer/build/mermaid/**",
    "docs-viewer/data/generated/**",
    "docs-viewer/runtime/vendor/**",
    "docs-viewer/scopes/**/published/**",
    "docs-viewer/tests/**",
    "processing/**",
    "site/**",
    "studio/**",
]

[lint]
select = ["E4", "E7", "E9", "F"]
fixable = []
