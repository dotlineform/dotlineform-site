<div class="tagRegistryPage">
  <div id="tag-registry" data-role="tag-registry" data-studio-ready="false" data-studio-busy="false">
    <div class="seriesTagsActions">
      <button type="button" class="studioUi__button" data-role="open-new-tag">New tag</button>
    </div>
    <p class="analyticsToolbar__result" data-role="route-result"></p>
    <section class="studioUi__panel">
      <div class="analyticsFilters" data-role="filters">
        <div class="studioUi__key analyticsFilters__key" data-role="key"></div>
        <label class="analyticsFilters__searchWrap">
          <span class="visually-hidden" data-role="search-label">Search tags</span>
          <input
            type="text"
            class="studioUi__input analyticsFilters__searchInput"
            data-role="search"
            placeholder="search"
            autocomplete="off"
          >
        </label>
      </div>
      <div data-role="list"></div>
    </section>
    <div data-role="modal-host"></div>
  </div>
</div>
